name: Build instinct.SIP calculator APK

on:
  push:
    branches: [ main ]
    paths:
      - 'calculator/**'
      - '.github/workflows/build-calculator-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Copy calculator web app into Android assets
        run: |
          mkdir -p calculator/android/app/src/main/assets/www
          cp -r calculator/web/* calculator/android/app/src/main/assets/www/

      - name: Build release APK (debug-signed)
        working-directory: calculator/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp calculator/android/app/build/outputs/apk/release/app-release.apk instinct.SIP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: instinct.SIP-apk
          path: instinct.SIP.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sip-v1.0.${{ github.run_number }}
          name: instinct.SIP calculator v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            instinct.SIP — SIP & Lumpsum calculator with goal planning and PDF client reports.
            Install: download `instinct.SIP.apk` on your phone → open it → allow "install from this source".
          files: instinct.SIP.apk
