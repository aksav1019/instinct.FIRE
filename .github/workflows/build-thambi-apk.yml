name: Build Thambi APK

on:
  push:
    branches: [ main, thambi-app ]
    paths:
      - 'thambi/**'
      - '.github/workflows/build-thambi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every lesson (structure, quiz answers, pictures)
        run: node thambi/tools/validate.js thambi/web/js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Copy the Thambi web app into Android assets
        run: |
          mkdir -p thambi/android/app/src/main/assets/www
          cp -r thambi/web/* thambi/android/app/src/main/assets/www/

      - name: Build release APK (debug-signed)
        working-directory: thambi/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp thambi/android/app/build/outputs/apk/release/app-release.apk thambi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thambi-apk
          path: thambi.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thambi-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Thambi v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Thambi — picture lessons on stock markets, personal finance, mutual funds, financial modelling and MS Office, with a gift for every finished topic, plus trackers for your Skillshare and WebVeda classes.
            Install: download `thambi.apk` on your phone → open it → allow "install from this source".
          files: thambi.apk
